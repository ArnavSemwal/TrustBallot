name: TrustBallot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-kiosk:
    name: Master Kiosk (Frontend & Middleware) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: master-kiosk/package-lock.json
      - name: Install Dependencies
        working-directory: master-kiosk
        run: npm ci
      - name: Run Vitest Unit Tests
        working-directory: master-kiosk
        run: npm test -- --run

  test-contracts:
    name: Smart Contracts & Hardhat Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Compile Contracts
        run: npx hardhat compile

  test-backend:
    name: FastAPI Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run Pytest
        working-directory: backend
        run: python -m pytest tests -v
